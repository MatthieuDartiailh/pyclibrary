name: Prepare release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to prepare in the changelog (for example 0.4.0)."
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  prepare-release-pr:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Create release notes PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install towncrier
        run: python -m pip install --upgrade pip towncrier
      - name: Build release notes
        run: python -m towncrier build --version "${{ inputs.version }}" --yes
      - name: Create release notes PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: prepare release notes for ${{ inputs.version }}"
          title: "Prepare release notes for ${{ inputs.version }}"
          body: |
            This PR was prepared by the manual release workflow to collect the towncrier fragments for version ${{ inputs.version }}.
            
            Once it is merged, the tag workflow will create the corresponding release tag.
          branch: "release-notes-${{ inputs.version }}"
          delete-branch: true
          labels: release

  create-tag:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'release-notes-') &&
        contains(github.event.pull_request.labels.*.name, 'release') &&
        startsWith(github.event.pull_request.title, 'Prepare release notes for ')
      }}
    name: Create release tag
    # The release environment is the primary safety gate; the bot login and branch/title checks narrow the trigger surface.
    environment:
      name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          version="${RELEASE_BRANCH#release-notes-}"
          if [ -z "${version}" ]; then
            echo "Unexpected release branch: ${RELEASE_BRANCH}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
